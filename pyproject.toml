[project]
name = "hms"
version = "0.0.0"
description = "Hospital Management System — hospital-side source of truth"
requires-python = ">=3.12,<3.13"

# Dependencies are pinned in requirements.txt / requirements-dev.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires the isolated PostgreSQL test database (TEST_DATABASE_URL)",
]
