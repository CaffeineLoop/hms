# Alembic configuration for the HMS.
#
# The database URL is deliberately NOT stored here. alembic/env.py reads it
# from the application Settings (DATABASE_URL environment variable / .env),
# so migrations and the application always target the same database and no
# credentials live in version control.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# Revision files: <rev>_<slug>.py, e.g. 0001_baseline.py
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

# Record timestamps in UTC.
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
